[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "finn-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "httpx[socks]>=0.28,<0.29", "beautifulsoup4>=4.13,<5", "yfinance>=1,<2", "pymupdf>=1.28.2,<2", "pydantic>=2.12,<3"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["finn*"]

[tool.setuptools.package-data]
finn = ["nse_calendar_2026.json"]
